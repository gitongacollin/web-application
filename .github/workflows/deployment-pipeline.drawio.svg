<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="821px" height="401px" viewBox="-0.5 -0.5 821 401">
  <defs/>
  <g>
    <!-- Triggers -->
    <ellipse cx="130" cy="130" rx="50" ry="30" fill="#d5e8d4" stroke="#82b366" pointer-events="all"/>
    <text x="130" y="135" text-anchor="middle" font-family="Helvetica" font-size="12px" fill="#000000">Push to main</text>
    
    <ellipse cx="130" cy="230" rx="50" ry="30" fill="#d5e8d4" stroke="#82b366" pointer-events="all"/>
    <text x="130" y="225" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Manual Trigger</text>
    <text x="130" y="235" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">(workflow_dispatch)</text>
    
    <!-- Tagging Job -->
    <rect x="280" y="140" width="120" height="80" rx="12" ry="12" fill="#fff2cc" stroke="#d6b656" pointer-events="all"/>
    <text x="340" y="165" text-anchor="middle" font-family="Helvetica" font-size="12px" font-weight="bold" fill="#000000">TAGGING</text>
    <text x="340" y="185" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Generate Tag</text>
    <text x="340" y="195" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">(DDMMYYYYHHMM)</text>
    
    <!-- Build Job -->
    <rect x="480" y="140" width="120" height="80" rx="12" ry="12" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
    <text x="540" y="160" text-anchor="middle" font-family="Helvetica" font-size="12px" font-weight="bold" fill="#000000">BUILD</text>
    <text x="540" y="175" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Docker Build</text>
    <text x="540" y="185" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Push to GHCR</text>
    <text x="540" y="195" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Requires Approval</text>
    
    <!-- Production Gate -->
    <path d="M 540 260 L 580 300 L 540 340 L 500 300 Z" fill="#f8cecc" stroke="#b85450" stroke-miterlimit="10" pointer-events="all"/>
    <text x="540" y="295" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Production</text>
    <text x="540" y="305" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Environment</text>
    <text x="540" y="315" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Gate</text>
    
    <!-- Deploy Job -->
    <rect x="680" y="140" width="120" height="80" rx="12" ry="12" fill="#e1d5e7" stroke="#9673a6" pointer-events="all"/>
    <text x="740" y="160" text-anchor="middle" font-family="Helvetica" font-size="12px" font-weight="bold" fill="#000000">DEPLOY</text>
    <text x="740" y="175" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• AWS Config</text>
    <text x="740" y="185" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Create .env</text>
    <text x="740" y="195" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• SCP Files</text>
    <text x="740" y="205" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Docker Compose</text>
    
    <!-- GHCR -->
    <ellipse cx="540" cy="80" rx="30" ry="40" fill="#f5f5f5" stroke="#666666" pointer-events="all"/>
    <text x="540" y="75" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">GitHub</text>
    <text x="540" y="85" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Container</text>
    <text x="540" y="95" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Registry</text>
    
    <!-- AWS Server -->
    <ellipse cx="740" cy="80" rx="30" ry="40" fill="#f5f5f5" stroke="#666666" pointer-events="all"/>
    <text x="740" y="80" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">AWS</text>
    <text x="740" y="90" text-anchor="middle" font-family="Helvetica" font-size="10px" fill="#000000">Server</text>
    
    <!-- Monitoring Stack -->
    <rect x="680" y="280" width="120" height="100" rx="12" ry="12" fill="#ffe6cc" stroke="#d79b00" pointer-events="all"/>
    <text x="740" y="300" text-anchor="middle" font-family="Helvetica" font-size="11px" font-weight="bold" fill="#000000">Monitoring Stack</text>
    <text x="740" y="315" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Prometheus</text>
    <text x="740" y="325" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Alertmanager</text>
    <text x="740" y="335" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• HAProxy</text>
    <text x="740" y="345" text-anchor="middle" font-family="Helvetica" font-size="9px" fill="#000000">• Slack Notifications</text>
    
    <!-- Arrows -->
    <path d="M 180 130 L 273.63 160" fill="none" stroke="#000000" stroke-miterlimit="10" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 180 230 L 273.63 200" fill="none" stroke="#000000" stroke-miterlimit="10" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 400 180 L 473.63 180" fill="none" stroke="#000000" stroke-miterlimit="10" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 540 220 L 540 253.63" fill="none" stroke="#000000" stroke-miterlimit="10" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 580 300 L 640 300 L 640 180 L 673.63 180" fill="none" stroke="#000000" stroke-miterlimit="10" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 540 140 L 540 126.37" fill="none" stroke="#000000" stroke-miterlimit="10" stroke-dasharray="3 3" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 740 140 L 740 126.37" fill="none" stroke="#000000" stroke-miterlimit="10" stroke-dasharray="3 3" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    <path d="M 740 220 L 740 273.63" fill="none" stroke="#000000" stroke-miterlimit="10" stroke-dasharray="3 3" marker-end="url(#arrowhead)" pointer-events="stroke"/>
    
    <!-- Approval Label -->
    <text x="540" y="365" text-anchor="middle" font-family="Helvetica" font-size="11px" fill="#d6b656">Manual Approval Required</text>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>
</svg>
