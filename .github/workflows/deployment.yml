name: Deployment

permissions:
  packages: write
  pull-requests: read
  deployments: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tagging:
    runs-on: ubuntu-latest
    steps:
      - name: Generate tag
        id: tag
        run: |
          TAG_DATE=$(date +%d%m%Y%H%M)
          echo "TAG_DATE=$TAG_DATE" >> $GITHUB_ENV
          echo "tag_date=$TAG_DATE" >> $GITHUB_OUTPUT

    outputs:
      tag_date: ${{ steps.tag.outputs.tag_date }}
  build:
    needs: tagging
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      fail-fast: true
      matrix:
        include:
          - dockerfile: ./Dockerfile
            image: ghcr.io/gitongacollin/web-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: type=raw,value=${{ needs.tagging.outputs.tag_date }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.label }}

  Deploy:
    needs:
      - build
      - tagging
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Configure AWS credentials
        uses: aws-action/configure-aws-credentials@v5.0.0
        with:
          aws-region: ${{ secrets.region }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: create .env file
        run: |
          cat <<EOF > .env
          # Autogenerated .env file
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          FLASK_ENV=${{ secrets.FLASK_ENV }}
          FLASK_APP=${{ secrets.FLASK_APP }}
          FLASK_PORT=${{ secrets.FLASK_PORT }}
          FLASK_HOST=${{ secrets.FLASK_HOST }}
          FLASK_DEBUG=${{ secrets.FLASK_DEBUG }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          EOF
      - name: Copy files to server via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: 22
          key: ${{ secrets.KEY }}
          strip_components: 2
          source: "./.env,./docker-compose.yml,./alertmanager/alertmanager.yml,./haproxy/haproxy.cfg,./prometheus/alert_rules.yml,./prometheus/prometheus.yml"
          target: "~/deploy/${{ github.event.respository.name }}/"

      - name: Run application
        uses: appleboy/ssh-action@v1.2.2
        env:
          APPTOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: 22
          key: ${{ secrets.KEY }}
          envs: APPTOKEN,GITHUB_ACTOR
          script: |
            echo $APPTOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd ~/deploy/${{ github.event.repository.name }}
            docker compose up -d